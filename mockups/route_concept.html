<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WildNav – route concept (mockup)</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow@5/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/barlow-semi-condensed@5/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- MOCKUP ONLY (IDEAS.md 7): invented data. Four activities, "My spots" list, routes mixing saved and generated stops. -->
<style>
:root{--slate:#20282a;--surface:#2a3437;--line:#3a4749;--ink:#e6ebe8;--muted:#a4b3b0;--dim:#6b7a77;--blaze:#f2c14e;
  --sleep:#f2c14e;--break:#3fa89a;--supply:#e0a030;--route:#e8743a;--bad:#e07a5f;--good:#6cc38a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Barlow,system-ui,sans-serif;font-size:13px;color:var(--ink);background:var(--slate);position:fixed;inset:0;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
.ic{width:1.3em;height:1.3em;flex-shrink:0;vertical-align:-.28em;filter:saturate(.72) brightness(.94)}
header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);z-index:1003}
.brand{font-family:"Barlow Semi Condensed";font-weight:700;font-size:19px;margin-right:6px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;width:200px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin-left:8px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px}
.tab{display:flex;align-items:center;gap:6px;border:0;background:none;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
.tab .ic{width:18px;height:18px}
.tab.on{background:var(--slate);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),inset 0 -2px 0 var(--c)}
.tab.on .ic{color:var(--c)}
.chip{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
.chip.on{border-color:var(--blaze)}
.chip b{font-weight:700}
.spacer{flex:1}
.wrap{flex:1;position:relative}
#map{position:absolute;inset:0;background:#cfd6d3}
.leaflet-tile-pane{filter:grayscale(1) brightness(1.06) contrast(.88)}
.card{position:absolute;background:var(--slate);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 5px #0006;z-index:1000}
.legend{left:10px;top:10px;width:250px;padding:9px 11px}
h3{font-family:"Barlow Semi Condensed";font-size:15px;display:flex;align-items:center;gap:7px}
.legend .bar{height:9px;border-radius:3px;margin:7px 0 3px}
.legend .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.legend details{margin-top:8px;font-size:12px}
.legend summary{cursor:pointer;color:var(--muted);list-style:none}
.legend summary::before{content:"▸ "}.legend details[open] summary::before{content:"▾ "}
.why{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.why span{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:2px 8px 2px 5px;font-size:11.5px}
.note{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:6px}
/* My spots */
#spots{left:10px;top:10px;width:300px;padding:10px 11px;display:none;max-height:calc(100% - 260px);overflow:auto}
#spots.open{display:block}
.filters{display:flex;gap:4px;margin:8px 0 4px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:1px 9px;cursor:pointer;color:var(--muted);font-size:12px}
.filters button.on{color:var(--ink);border-color:var(--muted)}
.sp{display:grid;grid-template-columns:14px 22px 1fr 26px;gap:6px;align-items:center;padding:6px 4px;border-radius:7px;cursor:pointer}
.sp:hover{background:var(--surface)}
.sp.drag{opacity:.4}
.sp .h{color:var(--dim);cursor:grab}.sp .h .ic{width:14px;height:14px}
.sp .t .ic{width:20px;height:20px}
.sp b{font-weight:600;display:block;line-height:1.2}
.sp small{color:var(--muted);font-size:11.5px}
.sp small.on{color:var(--route)}
.sp .st{color:var(--blaze);font-size:11px;margin-left:3px}
.tick{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}
.tick.on{background:var(--route);border-color:var(--route);color:#fff}
.tick .ic{width:15px;height:15px;filter:none}
.mk{position:relative;display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--c);border:2px solid #fff;
  box-shadow:0 1px 4px #0008;color:#fff;transition:transform .12s}
.mk .ic{width:15px;height:15px;filter:none}
.mk.hi{transform:scale(1.35);box-shadow:0 0 0 4px #fff6,0 1px 6px #000}
.mk.auto{border:2px dashed #fff}
.mk.ghost{opacity:.55;transform:scale(.8)}
.mk.saved::after{content:"★";position:absolute;right:-7px;top:-8px;font-size:11px;color:var(--blaze);text-shadow:0 0 2px #000}
.mk.night{width:30px;height:30px;color:#1d1a10}
.mk small{position:absolute;top:-15px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 0 3px #000;white-space:nowrap}
/* route window */
#rw{left:10px;right:10px;bottom:10px;padding:10px 12px 8px;transition:transform .2s}
#rw.min{transform:translateY(calc(100% - 42px))}
.rw-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rw-head h3{font-size:16px;margin-right:6px;cursor:pointer}
.rw-head label{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px}
.rw-head input,.rw-head select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--ink);width:100px}
.rw-head input.num{width:50px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:2px 9px;border-radius:5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--slate);color:var(--ink)}
.btn{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--blaze);border-color:var(--blaze);color:#1d1a10}
.btn.small{padding:1px 8px;font-size:12px}
.btn .ic{width:16px;height:16px}
.x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;display:flex}
.bar2{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:24px;font-size:12px;color:var(--muted)}
.bar2 .sel{color:var(--ink);display:flex;align-items:center;gap:6px}
.tl-wrap{overflow:hidden;margin-top:6px}
.tl{position:relative;height:150px}
.day{position:absolute;top:0;height:128px;border:1.5px solid var(--line);border-radius:8px;background:#ffffff06}
.day .t{position:absolute;left:7px;top:4px;right:6px;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.day .t b{color:var(--ink);font-weight:600}
.day .t .late{color:var(--bad)}
.prof{position:absolute;left:0;top:70px;height:48px;pointer-events:none}
.line{position:absolute;top:66px;height:4px;border-radius:2px;background:var(--route)}
.gap{position:absolute;top:72px;height:4px;border-radius:2px;background:var(--bad)}
.gapl{position:absolute;top:77px;font-size:10.5px;color:var(--bad);white-space:nowrap}
.it{position:absolute;top:54px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.it .mk{width:24px;height:24px}
.it .mk.night{width:30px;height:30px;cursor:grab}
.it .cap{font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:1px}
.it.nightit{top:22px}
.it.nightit .cap{color:var(--ink)}
.it .wx{font-size:10.5px;color:var(--muted);display:flex;align-items:center;gap:2px;white-space:nowrap}
.it .wx .ic{width:13px;height:13px}
.it.sel .mk{box-shadow:0 0 0 3px var(--blaze)}
.axis{position:absolute;top:132px;left:0;right:0;height:14px;font-size:10.5px;color:var(--dim)}
.axis span{position:absolute;transform:translateX(-50%)}
.hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--slate);border:1px solid var(--blaze);border-radius:8px;
  padding:6px 12px;z-index:1004;display:none}
.leaflet-tooltip{background:var(--slate);color:var(--ink);border:1px solid var(--line);font-family:Barlow}
</style>
</head>

  layers.route.eachLayer(l => l.setStyle && l.setStyle({ opacity: a === 'route' ? .85 : .35 }));
  const A = ACTS[a];
  $('#legend').innerHTML = `<h3>${ic(A.icon, A.c)}${A.title}</h3>` + (A.bar ? `<div class="bar" style="background:${A.bar}"></div><div class="lbl">${A.lbl.map(x => `<span>${x}</span>`).join('')}</div>` : '') +
    (A.why.length ? `<details><summary>Why this score</summary><div class="why">${A.why.map(([i, n]) => `<span>${ic(i)}${n}</span>`).join('')}</div></details>` : '') +
    `<div class="note">${A.note}</div>`;
  if (!keep) $('#rw').classList.toggle('min', a !== 'route');
}
$('#tabs').innerHTML = Object.entries(ACTS).map(([k, A]) => `<button class="tab" data-a="${k}" style="--c:${A.c}">${ic(A.icon)}${A.name}</button>`).join('');
document.querySelectorAll('.tab').forEach(t => t.onclick = () => showAct(t.dataset.a));
$('#rw-min').onclick = () => $('#rw').classList.toggle('min');
$('#rw-title').onclick = () => $('#rw').classList.remove('min');
document.querySelectorAll('#seg-to button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#seg-to button').forEach(x => x.classList.toggle('on', x === b));
  $('#to-dest').style.display = b.dataset.m === 'dest' ? '' : 'none'; $('#to-dir').style.display = b.dataset.m === 'dir' ? '' : 'none';
});
$('#plan').onclick = () => { perDay = Math.max(25, +$('#perday').value || 55); P = plan(); sel = null; drawMap(); drawTimeline(); showAct(act, true); renderSpots(); hint(`Planned: ${P.days.length - 1} days of ~${perDay} km`); };
$('#gpx').onclick = () => {                        // (mockup) pretend a GPX track came back from bikerouter.de: wiggly, exact
  const pts = []; for (let i = 1; i < WPTS.length; i++) for (let t = 0; t < 1; t += 0.05) { const a = WPTS[i - 1], b = WPTS[i];
    pts.push([a[0] + (b[0] - a[0]) * t + Math.sin(t * 17 + i) * 0.012, a[1] + (b[1] - a[1]) * t + Math.cos(t * 13 + i) * 0.015]); }
  pts.push(WPTS[WPTS.length - 1]); setRoute(pts, true); P = plan(); drawMap(); drawTimeline(); showAct(act, true); renderSpots();
  hint('(mockup) GPX loaded: exact track, real km; it stays on the map in every tab');
};
$('#br').onclick = () => {
  const pts = [WPTS[0], ...P.nights.map(n => where(n)), WPTS[WPTS.length - 1]].map(p => `${p[1].toFixed(5)},${p[0].toFixed(5)}`).join(';');
  window.open(`https://bikerouter.de/#map=9/52.02/8.95/standard&lonlats=${pts}`, '_blank');
};
const fit = () => map.fitBounds(L.latLngBounds(WPTS).pad(0.2), { paddingBottomRight: [0, 250], paddingTopLeft: [0, 0] });
addEventListener('resize', drawTimeline);
setRoute(WPTS); P = plan(); fit(); drawMap(); drawTimeline(); showAct('route'); renderSpots();
</script>
</body>
